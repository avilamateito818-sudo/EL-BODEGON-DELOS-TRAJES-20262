user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Nunca servir archivos .htaccess ni configuraciones PHP por HTTP
        location ~ /\.ht {
            deny all;
        }
        location ~ ^/api/(?:_config|config\.local[^/]*)\.php$ {
            deny all;
        }

        # Proteger directorio de datos privados y leads contra acceso web directo
        location ^~ /data/leads/ {
            deny all;
            return 403;
        }

        # Proteger uploads contra ejecución de scripts maliciosos (solo servir estáticos)
        location ^~ /assets/img/uploads/ {
            location ~ \.php$ {
                deny all;
                return 403;
            }
        }

        # Rutas limpias: /api/x -> api/x.php
        rewrite ^/api/(chat-ask|save-content|contact|auth|upload-media|catalogo|leads)$ /api/$1.php last;

        # Endpoints PHP vía php-fpm (sin caché de navegador)
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 30s;

            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        # Datos dinámicos y configuración editable (admin-content.js / json):
        # Excluidos del caché de 7 días para que los clientes vean cambios del CMS de inmediato
        location ^~ /data/ {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri =404;
        }

        # HTML y documentos SPA: revalidación inmediata contra el servidor
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri =404;
        }

        # Archivos estáticos CSS y JS: revalidación inmediata para sincronizar cambios en vivo
        location ~* \.(css|js)$ {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri =404;
        }

        # Recursos multimedia e imágenes
        location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            try_files $uri =404;
        }

        # SPA de una sola página: servir index.html para rutas no encontradas
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        # Cabeceras de seguridad básicas
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
