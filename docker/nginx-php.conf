user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Nunca servir archivos .htaccess ni configuraciones PHP por HTTP
        location ~ /\.ht {
            deny all;
        }
        location ~ ^/api/(?:_config|config\.local[^/]*)\.php$ {
            deny all;
        }

        # Rutas limpias: /api/x -> api/x.php
        rewrite ^/api/(chat-ask|save-content|contact)$ /api/$1.php last;

        # Endpoints PHP vía php-fpm
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 30s;
        }

        # Archivos estáticos con caché
        location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # SPA de una sola página: servir index.html para rutas no encontradas
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cabeceras de seguridad básicas
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
